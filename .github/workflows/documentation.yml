name: Documentation validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Get exact implementation baseline
        uses: actions/checkout@v5
        with:
          repository: Agents-Foundry/employee-agent-platform
          ref: d2bc8d7fa3fc185cc4f487bdaa1f11611844763f
          path: .sources/platform
          persist-credentials: false
      - run: npm run check:source
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-validation
          path: .validation/*-report.json
          if-no-files-found: ignore
